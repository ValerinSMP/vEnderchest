title: "Enderchest"
rows: 6

# Soporta números individuales y rangos (ej: "19-25")
page-slots:
  - "19-25"
  - "28-34"

page-item:

  available:
    material: PURPLE_STAINED_GLASS_PANE
    name: "<light_purple>⌂ Página {page}"
    lore:
      - "<white>Guarda tus objetos"
      - "<white>de forma segura"
      - ""
      - "<green>✂ <white>Objetos: <green>{items}/54"
      - ""
      - "<yellow>→ Click para abrir"

  locked:
    material: RED_STAINED_GLASS_PANE
    name: "<red>✘ Bloqueado"
    lore:
      - "<white>Adquiere más páginas"
      - "<white>para guardar más objetos"
      - "<white>o compra rangos para"
      - "<white>desbloquear más páginas."
      - ""
      - "<yellow>→ tienda.valerinsmp.com"

close:
  material: BARRIER
  name: "<red>✘ Cerrar"
  lore: []
  slot: 49

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  # Slots donde va el filler — soporta números y rangos
  slots:
    - "0-8"
    - "45-53"
