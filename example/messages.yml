    name: '&#FF6600&lᴘáɢɪɴᴀ ᴀɴᴛᴇʀɪᴏʀ'
  next-page:
    material: ARROW
    name: '&#FFCC00&lᴘáɢɪɴᴀ ꜱɪɢᴜɪᴇɴᴛᴇ'

# puedes desactivar cualquier mensaje configurándolo como ""
vault:
  not-unlocked: '&#FF0000¡No posees esta bóveda!'
  opened: '&f¡Bóveda &#55FF00#%num% &fabierta!'
  closed: '&f¡Bóveda &#55FF00#%num% &fcerrada!'

reload:
  success: '&#33FF33¡Plugin recargado exitosamente!'
  failed: '&#FF3333¡Error al recargar el plugin! Algo está mal en el archivo &f%file%&#FF3333, revisa la consola o usa un validador YAML para corregir los errores!'

set:
  success: '&#00FF00¡Has añadido exitosamente la bóveda a este bloque!'
  already: '&#FF0000¡Este bloque ya tiene una bóveda!'
  no-block: '&#FF0000¡Debes mirar hacia un bloque!'
