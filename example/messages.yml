help:
- <gradient:#55ff00:#AAFF00><b>AxVaults</b></gradient> <#88FF88>Ayuda
- ' <#88FF88>➤ <white>/axvaults <#DDDDDD>| <#AAFFAA>Abrir selector de bóvedas'
- ' <#88FF88>➤ <white>/axvaults <number> <#DDDDDD>| <#AAFFAA>Abrir bóveda'
- ' <#88FF88>➤ <white>/axvaultsadmin view <player> <vault> <#DDDDDD>| <#AAFFAA>Abrir bóveda de otro jugador'
- ' <#88FF88>➤ <white>/axvaultsadmin forceopen <player> <#DDDDDD>| <#AAFFAA>Abrir selector de bóvedas al jugador'
- ' <#88FF88>➤ <white>/axvaultsadmin set [number] <#DDDDDD>| <#AAFFAA>Añadir bóveda al bloque'
- ' <#88FF88>➤ <white>/axvaultsadmin reload <#DDDDDD>| <#AAFFAA>Recargar configuración'
- ' <#88FF88>➤ <white>/axvaultsadmin delete <player> <vault> <#DDDDDD>| <#AAFFAA>Eliminar bóveda del jugador'
- ' <#88FF88>➤ <white>/axvaultsadmin stats <#DDDDDD>| <#AAFFAA>Estadísticas del servidor'
- ' <#88FF88>➤ <white>/axvaultsadmin converter <plugin> <#DDDDDD>| <#AAFFAA>Convertir desde otro plugin'
- ' <#88FF88>➤ <white>/axvaultsadmin save <#DDDDDD>| <#AAFFAA>Guardar manualmente todas las bóvedas cargadas'
- ' <#88FF88>➤ <white>/axvaultsadmin debug <#DDDDDD>| <#AAFFAA>Imprimir información útil en consola'
- ' '

guis:
  selector:
    title: '&0Mis Bóvedas'
    item-owned:
      # los jugadores pueden cambiar el material si tienen permisos, este es el valor predeterminado
      material: BARREL
      name: '&#55ff00&lBóveda #%num%'
      glow: false
      lore:
      - ' '
      - ' &7- &fRanuras: &#aaffaa%used%&7/&#55ff00%max%'
      - ' '
      - '&#55ff00&l(!) &#55ff00Clic - Abrir Bóveda'
      - '&#55ff00&l(!) &#55ff00Mayús + Clic - Cambiar Objeto'
    item-locked:
      material: RED_STAINED_GLASS_PANE
      name: '&#FF0000&lBóveda #%num%'
      glow: false
      lore:
      - ' '
      - ' &7- &f¡Aún &#FF0000no has desbloqueado &festa bóveda!'
      - ' '
      - '&#FF0000&l(!) &#FF0000Bóveda Bloqueada'
  item-picker:
    title: '&0Selector de Objetos'
  vault:
    title: '&0Bóveda #%num%'

gui-items:
  close:
    material: BARRIER
    name: '&#FF3333&lᴄᴇʀʀᴀʀ'
  back:
    material: BARRIER
    name: '&#FF3333&lᴠᴏʟᴠᴇʀ'
  previous-page:
