no-permission: '&#FF0000¡No tienes permisos para usar esto!'
force-open: '&#00FF00¡Selector de bóvedas abierto para &f%player%&#55FF00!'
force-open-vault: '&#00FF00¡Abriendo bóveda &f#%num% &#00FF00para &f%player%&#55FF00!'
delete: '&f¡Bóveda &#FF0000#%num% &fde &#FF0000%player% &feliminada!'
banned-item: '&#FF0000¡No puedes poner este objeto en las bóvedas!'

