# puedes desactivar los sonidos configurando las secciones como ""
# por ejemplo: open: ""
# lista de sonidos: https://www.digminecraft.com/lists/sound_list_pc.php
# formato: <sonido>|[volumen]|[tono] (volumen y tono son opcionales)
sounds:
  open: block.barrel.open|1.0|1.0
  close: block.barrel.close|1.0|1.0
  select-icon: block.barrel.close|1.0|1.0

