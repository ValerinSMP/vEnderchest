max-pages: 14
default-pages: 1
autosave-minutes: 5

database:
  type: sqlite   # sqlite / mysql
  # Letras, numeros y guion bajo. Debe ser igual en todos los servidores de la red.
  table-prefix: ec_
  sqlite:
    file: enderchest.db
  mysql:
    host: localhost
    port: 3306
    database: venderchest
    username: root
    password: ""
    pool-size: 5

# Coordinacion entre servidores. MySQL conserva siempre el contenido autoritativo;
# Redis solo coordina leases rapidos. Dejalo apagado para un servidor unico.
cross-server:
  # MySQL conserva la autoridad y Redis coordina leases. Las acciones de GUI se confirman
  # de forma durable antes de mostrarse; DROP/clic fuera/creative permanecen bloqueados.
  enabled: false
  network: valerin
  server-id: server-1
  redis:
    host: localhost
    port: 6379
    username: ""
    password: ""
    tls: false
    database: 0
    timeout-ms: 1500
  lease:
    ttl-ms: 30000
    renew-ms: 5000
    safety-ms: 10000
    mysql-seconds: 45

# Ítems que no pueden guardarse en el enderchest
blacklist: []

# Controla únicamente la salida estructurada [audit] en consola. No desactiva la protección
# anti-dupe, los eventos de la API, la persistencia ni la resolución interna de conflictos.
audit:
  console-enabled: true

# Protección contra duplicación y observabilidad forense (para integración futura con vAntiDupe).
# La protección en sí (serialización de sesiones + revisión optimista) SIEMPRE está activa y NO
# tiene interruptor aquí: estas opciones solo controlan identificación y nivel de logging.
vantidupe:
  # Identificador de este servidor, usado en logs y en la API pública cuando varios servidores
  # comparten la misma base de datos MySQL.
  server-id: "server-1"
  # MINIMAL: solo conflictos/reaperturas sospechosas. NORMAL: + apertura/cierre/commit. VERBOSE: + detalle por slot.
  audit-level: NORMAL
  # Cada cuántos segundos se revisa (solo en memoria, nunca la base de datos) si alguna sesión
  # abierta quedó huérfana porque su jugador se desconectó sin un cierre limpio.
  orphan-sweep-seconds: 60
  # Si es true, los conflictos se registran como warning (más visibles en consola); si es false,
  # se siguen registrando siempre, solo que como info.
  warn-console-on-conflict: true

# Backups automáticos: cada vez que un vault se guarda con cambios reales, se guarda además una
# copia con su revisión. Se puede ver y restaurar con /venderchestadmin restore <jugador> [id] [confirm].
backups:
  enabled: true
  # Cuántas copias se conservan por página de vault; las más viejas se borran automáticamente.
  keep-per-vault: 20
