title: "vEnderchest"
rows: 6

# Soporta números individuales y rangos (ej: "19-25")
page-slots:
  - "19-25"
  - "28-34"

page-item:
  available:
    material: PURPLE_STAINED_GLASS_PANE
    name: "<light_purple>Página <white>{page}"
    lore:
      - ""
      - "<gray>Click para abrir"
  locked:
    material: RED_STAINED_GLASS_PANE
    name: "<red>Bloqueado"
    lore:
      - ""
      - "<gray>Necesitas el permiso"
      - "<white>venderchest.pages.{page}"

close:
  material: BARRIER
  name: "<red>✘ Cerrar"
  lore: []
  slot: 49

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  # Slots donde va el filler — soporta números y rangos
  slots:
    - "0-8"
    - "45-53"
