name: vEnderchest
version: "${version}"
main: com.valerin.venderchest.VEnderchest
api-version: '1.21'
author: Valerin
description: Enderchest extendido multi-página

softdepend:
  - PlaceholderAPI

commands:
  venderchest:
    description: Información principal de vEnderchest
    usage: /venderchest <help|about>
    aliases: [vec]
  ec:
    description: Abre tu enderchest extendido
    usage: /ec [página]
    aliases: [enderchest, pv, playervaults, vault, vaults]
    permission: venderchest.use
  venderchestadmin:
    description: Administración de enderchests
    usage: /venderchestadmin <help|view|clear|reload> [jugador] [página]
    aliases: [ecadmin, pvadmin, echestadmin, enderchestadmin]
    permission: venderchest.admin

permissions:
  venderchest.command:
    description: Permite usar el comando informativo de vEnderchest
    default: true
  venderchest.use:
    description: Acceso básico al enderchest extendido
    default: op
  venderchest.bypass:
    description: Abre el enderchest vanilla real ignorando vEnderchest
    default: op
  venderchest.admin:
    description: Todos los comandos de administración de /venderchestadmin (implica view y edit)
    default: op
    children:
      venderchest.admin.view: true
      venderchest.admin.edit: true
  venderchest.admin.view:
    description: Ver vaults de cualquier jugador (solo lectura)
    default: false
  venderchest.admin.edit:
    description: Ver y editar vaults de cualquier jugador
    default: false
  venderchest.pages.1:
    description: 1 página de enderchest
    default: true
  venderchest.pages.2:
    description: 2 páginas de enderchest
    default: false
  venderchest.pages.3:
    description: 3 páginas de enderchest
    default: false
  venderchest.pages.4:
    description: 4 páginas de enderchest
    default: false
  venderchest.pages.5:
    description: 5 páginas de enderchest
    default: false
  venderchest.pages.6:
    description: 6 páginas de enderchest
    default: false
  venderchest.pages.7:
    description: 7 páginas de enderchest
    default: false
  venderchest.pages.8:
    description: 8 páginas de enderchest
    default: false
  venderchest.pages.9:
    description: 9 páginas de enderchest
    default: false
